<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
<title id="title">Offline regret ladder for bid selectors</title>
<desc id="desc">With realized terminal gem value supplied to isolate price modeling, distributional expected value reduces regret more than a point-price selector and approaches the best legal bid at realized prices on logged Flash auctions.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a3a3a3"/></marker>
