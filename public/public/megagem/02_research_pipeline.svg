<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
<title id="title">MegaGem research and training pipeline</title>
<desc id="desc">The project moves from a benchmark to SFT, a flat GRPO phase, diagnosis, an analytic distributional best response, and distillation into the final model.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a3a3a3"/></marker>
</defs>
<rect width="1500" height="700" fill="#181818"/>
<text x="58.0" y="64.0" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="600" text-anchor="start" opacity="1.0">The six-stage research loop</text>
<text x="1442.0" y="64.0" fill="#a3a3a3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end" opacity="1.0">the failed stage is the useful one</text>
<rect x="55.0" y="150.0" width="215.0" height="365.0" rx="12.0" fill="#242424" stroke="#91c8ef" stroke-width="2.0" opacity="1.0"/>
<text x="79.0" y="192.0" fill="#91c8ef" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" opacity="1.0">01</text>
<text x="79.0" y="242.0" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start" opacity="1.0">Benchmark</text>
<line x1="79.0" y1="266.0" x2="246.0" y2="266.0" stroke="#464646" stroke-width="1.0" opacity="1.0"/>
<text x="79.0" y="313.0" fill="#a3a3a3" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="79.0" dy="0.0">13 models</tspan><tspan x="79.0" dy="31.3">624 games</tspan><tspan x="79.0" dy="31.3">paired evals</tspan></text>
<line x1="273.0" y1="332.5" x2="289.0" y2="332.5" stroke="#a3a3a3" stroke-width="2.0" opacity="1.0" marker-end="url(#arrow)"/>
<rect x="294.0" y="150.0" width="215.0" height="365.0" rx="12.0" fill="#242424" stroke="#91c8ef" stroke-width="2.0" opacity="1.0"/>
<text x="318.0" y="192.0" fill="#91c8ef" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" opacity="1.0">02</text>
<text x="318.0" y="242.0" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start" opacity="1.0">SFT</text>
<line x1="318.0" y1="266.0" x2="485.0" y2="266.0" stroke="#464646" stroke-width="1.0" opacity="1.0"/>
<text x="318.0" y="313.0" fill="#a3a3a3" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="318.0" dy="0.0">6,153 examples</tspan><tspan x="318.0" dy="31.3">2.8% → 64.7%</tspan><tspan x="318.0" dy="31.3">legal + concise</tspan></text>
<line x1="512.0" y1="332.5" x2="528.0" y2="332.5" stroke="#a3a3a3" stroke-width="2.0" opacity="1.0" marker-end="url(#arrow)"/>
<rect x="533.0" y="150.0" width="215.0" height="365.0" rx="12.0" fill="#242424" stroke="#f87171" stroke-width="2.0" opacity="1.0"/>
<text x="557.0" y="192.0" fill="#f87171" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" opacity="1.0">03</text>
<text x="557.0" y="242.0" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start" opacity="1.0">Self-play GRPO</text>
<line x1="557.0" y1="266.0" x2="724.0" y2="266.0" stroke="#464646" stroke-width="1.0" opacity="1.0"/>
<text x="557.0" y="313.0" fill="#a3a3a3" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="557.0" dy="0.0">7 mainline runs</tspan><tspan x="557.0" dy="31.3">optimizer active</tspan><tspan x="557.0" dy="31.3">anchors flat</tspan></text>
<rect x="553.0" y="446.0" width="175.0" height="42.0" rx="8.0" fill="#3a2020" stroke="#f87171" stroke-width="1.5" opacity="1.0"/>
<text x="640.5" y="475.0" fill="#f87171" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" opacity="1.0">NO TRANSFER</text>
<line x1="751.0" y1="332.5" x2="767.0" y2="332.5" stroke="#a3a3a3" stroke-width="2.0" opacity="1.0" marker-end="url(#arrow)"/>
<rect x="772.0" y="150.0" width="215.0" height="365.0" rx="12.0" fill="#242424" stroke="#ffab5e" stroke-width="2.0" opacity="1.0"/>
<text x="796.0" y="192.0" fill="#ffab5e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" opacity="1.0">04</text>
<text x="796.0" y="242.0" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start" opacity="1.0">Diagnose</text>
<line x1="796.0" y1="266.0" x2="963.0" y2="266.0" stroke="#464646" stroke-width="1.0" opacity="1.0"/>
<text x="796.0" y="313.0" fill="#a3a3a3" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="796.0" dy="0.0">opponent-specific Q</tspan><tspan x="796.0" dy="31.3">noisy critic labels</tspan><tspan x="796.0" dy="31.3">point-price floor</tspan></text>
<line x1="990.0" y1="332.5" x2="1006.0" y2="332.5" stroke="#a3a3a3" stroke-width="2.0" opacity="1.0" marker-end="url(#arrow)"/>
<rect x="1011.0" y="150.0" width="215.0" height="365.0" rx="12.0" fill="#242424" stroke="#7fee64" stroke-width="2.0" opacity="1.0"/>
<text x="1035.0" y="192.0" fill="#7fee64" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" opacity="1.0">05</text>
<text x="1035.0" y="242.0" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start" opacity="1.0">Analytic expert</text>
<line x1="1035.0" y1="266.0" x2="1202.0" y2="266.0" stroke="#464646" stroke-width="1.0" opacity="1.0"/>
<text x="1035.0" y="313.0" fill="#a3a3a3" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="1035.0" dy="0.0">bid distribution</tspan><tspan x="1035.0" dy="31.3">pacing + calibration</tspan><tspan x="1035.0" dy="31.3">+12.16 live</tspan></text>
<rect x="1031.0" y="446.0" width="175.0" height="42.0" rx="8.0" fill="#20351f" stroke="#7fee64" stroke-width="1.5" opacity="1.0"/>
<text x="1118.5" y="475.0" fill="#7fee64" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" opacity="1.0">CONVERTS LIVE</text>
<line x1="1229.0" y1="332.5" x2="1245.0" y2="332.5" stroke="#a3a3a3" stroke-width="2.0" opacity="1.0" marker-end="url(#arrow)"/>
<rect x="1250.0" y="150.0" width="215.0" height="365.0" rx="12.0" fill="#242424" stroke="#7fee64" stroke-width="2.0" opacity="1.0"/>
<text x="1274.0" y="192.0" fill="#7fee64" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" opacity="1.0">06</text>
<text x="1274.0" y="242.0" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start" opacity="1.0">Distill + test</text>
<line x1="1274.0" y1="266.0" x2="1441.0" y2="266.0" stroke="#464646" stroke-width="1.0" opacity="1.0"/>
<text x="1274.0" y="313.0" fill="#a3a3a3" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="1274.0" dy="0.0">weights only</tspan><tspan x="1274.0" dy="31.3">1275 PL-Elo</tspan><tspan x="1274.0" dy="31.3">top tier</tspan></text>
<rect x="1270.0" y="446.0" width="175.0" height="42.0" rx="8.0" fill="#20351f" stroke="#7fee64" stroke-width="1.5" opacity="1.0"/>
<text x="1357.5" y="475.0" fill="#7fee64" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" opacity="1.0">CONVERTS LIVE</text>
<rect x="260.0" y="565.0" width="980.0" height="78.0" rx="12.0" fill="#2f2f2f" stroke="#464646" stroke-width="1.5" opacity="1.0"/>
<text x="750.0" y="600.0" fill="#e8e8e8" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle" opacity="1.0">policy-game logs  →  fitted price law  →  analytic best response  →  supervised distillation</text>
<text x="750.0" y="630.0" fill="#a3a3a3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" opacity="1.0">The decision-level data survived. The policy-gradient objective did not.</text>
</svg>
