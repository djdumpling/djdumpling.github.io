<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">How a MegaGem round works</title>
<desc id="desc">Three players make sealed bids; the winner takes the lot, reveals a private gem, and changes the public values used to score all collections.</desc>
