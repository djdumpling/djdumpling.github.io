<rect x="95.0" y="618.0" width="1265.0" height="64.0" rx="8.0" fill="#2f2f2f" stroke="#464646" stroke-width="1.5" opacity="1.0"/>
<text x="727.0" y="643.0" fill="#a3a3a3" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" opacity="1.0">Each row uses its run-specific SFT control; cross-row differences are descriptive, not paired.</text>
<text x="727.0" y="667.0" fill="#a3a3a3" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" opacity="1.0">CV adjustment is model-assisted; raw paired estimates are primary in the text.</text>
