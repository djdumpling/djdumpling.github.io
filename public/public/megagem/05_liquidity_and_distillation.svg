<text x="1392.0" y="64.0" fill="#a3a3a3" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end" opacity="1.0">CV-adjusted paired margin/game · separate experiments · n=150 each</text>
