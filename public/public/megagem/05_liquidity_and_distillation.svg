<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="700" viewBox="0 0 1450 700" role="img" aria-labelledby="title desc">
<title id="title">Held-out effects across the analytic and distilled interventions</title>
<desc id="desc">Five separate 150-pair experiments show that myopic distributional EV is unresolved and negative, pacing turns the result positive, an SFT-fitted price law retains most of the gain, and style-matched distillation carries the gain into model weights.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a3a3a3"/></marker>
</defs>
<rect width="1450" height="700" fill="#181818"/>
