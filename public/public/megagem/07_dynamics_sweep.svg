<title id="title">Dynamics simulator sweep over liquidity pacing and value calibration</title>
<desc id="desc">Eighteen simulator arms compare paired margin and deviations per game. The archived live setting sits near the failed stage-1 myopic selector&#x27;s behavioral footprint. Lambda values at least one are muted as proxy-rescue artifacts. Absolute calibration failed, so live evaluation supplies the effect estimate.</desc>
